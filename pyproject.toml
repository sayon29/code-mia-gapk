[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-mia-gapk"
version = "0.1.0"
description = "Auditable vanilla Gap-K% baseline for code membership inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "transformers>=4.39,<5",
  "datasets>=2.18,<4",
  "huggingface-hub>=0.21",
  "nltk>=3.8",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
code-mia = "code_mia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

